[project]
name = "bambu-geometry"
version = "0.1.0"
description = "Worker CAO (STEP + paramétrique CadQuery) pour BAMBULAB-MCP : CLI JSON stdin/stdout"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
# Sans cet extra, `step_import` répond step_backend_missing et `parametric` cad_backend_missing.
cad = ["cadquery>=2.4"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bambu_geometry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
