<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Atelier">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ee39c"/>
      <stop offset="0.5" stop-color="#14a26c"/>
      <stop offset="1" stop-color="#095a40"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#eafff5"/>
      <stop offset=".45" stop-color="#9dffd2" stop-opacity=".9"/>
      <stop offset="1" stop-color="#9dffd2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".25"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#shine)"/>

  <!-- bulle de conversation formée de couches imprimées -->
  <g fill="#fff">
    <rect x="112" y="300" width="288" height="44" rx="22"/>
    <rect x="140" y="360" width="232" height="44" rx="22"/>
    <path d="M150 396 h64 l-70 62 c-8 7 -19 0 -16 -10 z"/>
    <!-- couche en cours : pas encore terminée -->
    <rect x="140" y="240" width="168" height="44" rx="22"/>
  </g>

  <!-- buse qui dépose la couche en cours -->
  <g fill="#fff">
    <rect x="262" y="96" width="112" height="56" rx="16"/>
    <path d="M286 152 h64 l-22 50 h-20 z"/>
  </g>
  <circle cx="318" cy="226" r="34" fill="url(#glow)"/>
  <circle cx="318" cy="222" r="10" fill="#fff"/>
</svg>
