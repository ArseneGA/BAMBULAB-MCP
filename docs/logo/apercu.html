<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Logo Atelier</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
  body{margin:0;font-family:"DM Sans",system-ui,sans-serif;background:#f4f6f8;color:#14231c;padding:40px}
  h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#5b6b63;margin:36px 0 14px}
  .row{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
  .card{border-radius:22px;padding:32px 40px;display:flex;align-items:center;gap:18px}
  .light{background:#fff;box-shadow:0 14px 36px -14px rgba(11,94,67,.25)}
  .dark{background:#0f1714}
  .word{font-weight:700;font-size:44px;letter-spacing:-.03em;line-height:1}
  .word span{color:#16a06b}
  .dark .word{color:#eef7f2}.dark .word span{color:#2fd38f}
  .tag{font-size:15px;color:#5b6b63;margin-top:6px;font-weight:500}
  .dark .tag{color:#93a99e}
  .sw{width:90px;height:90px;border-radius:18px;display:flex;align-items:flex-end;padding:8px;font-size:11px;color:#fff;box-sizing:border-box}
</style></head><body>
<h2>Icône</h2>
<div class="row">
  <img src="atelier-icon.svg" width="200">
  <img src="atelier-icon.svg" width="96">
  <img src="atelier-icon.svg" width="48">
  <img src="atelier-icon.svg" width="24">
</div>
<h2>Logo complet</h2>
<div class="row">
  <div class="card light"><img src="atelier-icon.svg" width="72"><div><div class="word">atelier<span>.</span></div><div class="tag">Fabriquer en parlant</div></div></div>
  <div class="card dark"><img src="atelier-icon.svg" width="72"><div><div class="word">atelier<span>.</span></div><div class="tag">Fabriquer en parlant</div></div></div>
</div>
<h2>Palette</h2>
<div class="row">
  <div class="sw" style="background:#2fd38f">#2fd38f</div>
  <div class="sw" style="background:#16a06b">#16a06b</div>
  <div class="sw" style="background:#0b5e43">#0b5e43</div>
  <div class="sw" style="background:#0f1714">#0f1714</div>
  <div class="sw" style="background:#f4f6f8;color:#14231c">#f4f6f8</div>
</div>
</body></html>
